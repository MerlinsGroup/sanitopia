<!-- =====================================================================
     SANITOPIA NAVBAR — self-contained (HTML + CSS + JS in one block)
     HOW TO USE IN WORDPRESS:
       1. Add a "Custom HTML" block (or use a header/code widget).
       2. Paste this whole file in.
       3. Update the href="" values to point at your real WordPress pages.
     Everything is namespaced under .sn-root so it won't clash with your theme.
     ===================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  .sn-root {
    /* Sanitopia brand tokens (scoped so they don't touch the rest of WP) */
    --sn-paper: #FAF6EE;
    --sn-paper-2: #F0E9DA;
    --sn-soft: #FFFDF8;
    --sn-ink: #14091F;
    --sn-ink-2: #2D1A45;
    --sn-clay: #3F1773;
    --sn-clay-dark: #2A0F50;
    --sn-gold: #D4AF37;
    --sn-line: rgba(20, 9, 31, 0.10);
    --sn-line-strong: rgba(20, 9, 31, 0.20);
    --sn-display: "Playfair Display", "Times New Roman", serif;
    --sn-sans: "Poppins", system-ui, sans-serif;
    --sn-container: 1280px;
    --sn-radius: 6px;
    font-family: var(--sn-sans);
  }
  .sn-root *, .sn-root *::before, .sn-root *::after { box-sizing: border-box; }
  .sn-root a { text-decoration: none; color: inherit; }
  .sn-root ul { list-style: none; margin: 0; padding: 0; }
  .sn-root img { max-width: 100%; display: block; }
  .sn-root button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ---- Top bar ---- */
  .sn-topbar {
    background: var(--sn-ink);
    color: var(--sn-paper);
    font-size: 0.78rem;
    letter-spacing: 0.05em;
  }
  .sn-topbar-inner {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0.55rem 1.5rem;
    max-width: var(--sn-container);
    margin: 0 auto;
    text-align: center;
  }

  /* ---- Sticky nav ---- */
  .sn-nav {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(250, 246, 238, 0.88);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--sn-line);
  }
  .sn-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    max-width: var(--sn-container);
    margin: 0 auto;
    gap: 2rem;
  }
  .sn-brand { display: inline-flex; align-items: center; }
  .sn-brand-logo { height: 56px; width: auto; }

  .sn-links {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .sn-links a {
    padding: 0.55rem 0.85rem;
    font-size: 0.94rem;
    font-weight: 500;
    color: var(--sn-ink-2);
    border-radius: var(--sn-radius);
    transition: color 0.2s, background 0.2s;
  }
  .sn-links a:hover, .sn-links a.active { color: var(--sn-clay); }
  .sn-links a.active { background: rgba(63, 23, 115, 0.08); }

  .sn-cta { display: flex; gap: 1rem; align-items: center; }
  .sn-partner {
    padding: 0.5rem 1rem;
    color: var(--sn-ink);
    font-weight: 500;
    font-size: 0.94rem;
    border-radius: 999px;
    transition: color 0.2s;
  }
  .sn-partner:hover { color: var(--sn-clay); }
  .sn-donate {
    position: relative;
    background: linear-gradient(135deg, var(--sn-clay) 0%, var(--sn-clay-dark) 100%);
    color: var(--sn-paper);
    padding: 0.85rem 1.6rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    box-shadow: 0 6px 20px rgba(63,23,115,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .sn-donate::before { content: "\2665"; color: var(--sn-gold); font-size: 0.9rem; }
  .sn-donate::after { content: "\2192"; transition: transform 0.25s ease; }
  .sn-donate:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(63,23,115,0.5), 0 0 0 1px var(--sn-gold); }
  .sn-donate:hover::after { transform: translateX(4px); }

  /* ---- Hamburger ---- */
  .sn-toggle {
    display: none;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--sn-line-strong);
    align-items: center;
    justify-content: center;
  }
  .sn-toggle span {
    display: block;
    width: 18px; height: 2px;
    background: var(--sn-ink);
    position: relative;
    transition: background 0.2s;
  }
  .sn-toggle span::before, .sn-toggle span::after {
    content: "";
    position: absolute;
    left: 0;
    width: 18px; height: 2px;
    background: var(--sn-ink);
    transition: transform 0.2s, top 0.2s;
  }
  .sn-toggle span::before { top: -6px; }
  .sn-toggle span::after { top: 6px; }
  .sn-toggle.open span { background: transparent; }
  .sn-toggle.open span::before { top: 0; transform: rotate(45deg); }
  .sn-toggle.open span::after { top: 0; transform: rotate(-45deg); }

  /* ---- Mobile slide-in menu ---- */
  .sn-mobile {
    position: fixed;
    inset: 0;
    background: var(--sn-paper);
    z-index: 39;
    padding: 6rem 1.5rem 2rem;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .sn-mobile.open { transform: translateX(0); }
  .sn-mobile .sn-m-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    font-family: var(--sn-display);
    font-size: 1.7rem;
    letter-spacing: -0.02em;
    padding: 1rem 0;
    border-bottom: 1px solid var(--sn-line);
    color: var(--sn-ink);
  }
  .sn-mobile .sn-m-link span { color: var(--sn-clay); }
  .sn-mobile .sn-m-donate {
    margin-top: 2rem;
    display: block;
    text-align: center;
    background: var(--sn-clay);
    color: var(--sn-paper);
    padding: 1rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .sn-mobile .sn-m-partner {
    margin-top: 1rem;
    display: block;
    text-align: center;
    background: var(--sn-paper-2);
    color: var(--sn-ink);
    padding: 1rem;
    border-radius: 999px;
    font-weight: 600;
  }

  /* ---- Responsive ---- */
  @media (max-width: 980px) {
    .sn-root .sn-links, .sn-root .sn-cta { display: none; }
    .sn-root .sn-toggle { display: inline-flex; }
    .sn-inner { padding: 0.8rem 1.2rem; }
  }
</style>

<div class="sn-root">

  <!-- Top bar -->
  <div class="sn-topbar">
    <div class="sn-topbar-inner">
      UK Community Interest Company &middot; Registered non-profit in Ghana
    </div>
  </div>

  <!-- Sticky navbar -->
  <header class="sn-nav">
    <div class="sn-inner">
      <a href="index.html" class="sn-brand" aria-label="Sanitopia home">
        <img class="sn-brand-logo" src="https://sanitopiaprojects.org/wp-content/uploads/2020/04/Sanitopia-Logo-black-png-1.png" alt="Sanitopia" />
      </a>

      <nav aria-label="Primary">
        <ul class="sn-links">
          <li><a href="projects.html">Our Work</a></li>
          <li><a href="impact.html">Impact</a></li>
          <li><a href="partner-ghana.html">Partner in Ghana</a></li>
          <li><a href="founder.html">Richard's Story</a></li>
          <li><a href="news.html">Updates</a></li>
        </ul>
      </nav>

      <div class="sn-cta">
        <a href="partner-ghana.html" class="sn-partner">Partner With Us</a>
        <a href="donate.html" class="sn-donate">Donate to a Facility</a>
      </div>

      <button class="sn-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button>
    </div>
  </header>

  <!-- Mobile menu -->
  <aside class="sn-mobile" aria-label="Mobile menu">
    <a href="projects.html" class="sn-m-link">Our Work <span>&rarr;</span></a>
    <a href="impact.html" class="sn-m-link">Impact <span>&rarr;</span></a>
    <a href="partner-ghana.html" class="sn-m-link">Partner in Ghana <span>&rarr;</span></a>
    <a href="founder.html" class="sn-m-link">Richard's Story <span>&rarr;</span></a>
    <a href="news.html" class="sn-m-link">Updates <span>&rarr;</span></a>
    <a href="partner-ghana.html" class="sn-m-partner">Partner With Us</a>
    <a href="donate.html" class="sn-m-donate">Donate to a Facility</a>
  </aside>

</div>

<script>
  (function () {
    var root = document.currentScript ? document.currentScript.previousElementSibling : null;
    // Fall back to the last .sn-root on the page if needed.
    if (!root || !root.classList || !root.classList.contains('sn-root')) {
      var all = document.querySelectorAll('.sn-root');
      root = all[all.length - 1];
    }
    if (!root) return;

    var toggle = root.querySelector('.sn-toggle');
    var mobile = root.querySelector('.sn-mobile');
    if (!toggle || !mobile) return;

    toggle.addEventListener('click', function () {
      var open = !mobile.classList.contains('open');
      mobile.classList.toggle('open', open);
      toggle.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      document.body.style.overflow = open ? 'hidden' : '';
    });

    // Close the menu when any link inside it is tapped.
    mobile.addEventListener('click', function (e) {
      if (e.target.closest('a')) {
        mobile.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      }
    });
  })();
</script>
